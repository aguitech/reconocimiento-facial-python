[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconocimiento-facial"
version = "0.1.0"
description = "Sistema de reconocimiento facial en Python con detección, encoding, base de datos, API REST y CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Héctor Aguilar", email = "hector@aguitech.com" }
]
keywords = ["face-recognition", "opencv", "dlib", "fastapi", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "opencv-contrib-python>=4.8",
    "face-recognition>=1.3.0",
    "dlib>=19.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "typer>=0.9",
    "rich>=13.7",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "black>=23.12",
    "ruff>=0.1.9",
    "mypy>=1.8",
]
docker = [
    "gunicorn>=21.2",
]

[project.scripts]
rf-detect = "reconocimiento_facial.cli:app"

[project.urls]
Homepage = "https://github.com/aguitech/reconocimiento-facial-python"
Repository = "https://github.com/aguitech/reconocimiento-facial-python.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reconocimiento_facial = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict_optional = true
warn_unused_ignores = true